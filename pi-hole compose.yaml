services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"

    environment:
      TZ: "America/Toronto"
      FTLCONF_webserver_api_password: "INSERT PASSWORD" #NOT THE ACTUAL PASSWORD 
      FTLCONF_dns_listeningMode: "all"

    volumes:
      - "./etc-pihole:/etc/pihole"

    restart: unless-stopped
